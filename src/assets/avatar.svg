<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Neo-Brutalist Illustrated Avatar of Azhriel -->
  <rect width="400" height="400" fill="#FFEFC2" />
  
  <!-- Subtle background grid inside avatar -->
  <defs>
    <pattern id="avatar-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111111" stroke-width="1" stroke-opacity="0.1" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#avatar-grid)" />

  <!-- Backdrop shapes -->
  <circle cx="200" cy="220" r="140" fill="#FF8FB8" stroke="#111111" stroke-width="3.5" />
  <rect x="70" y="80" width="50" height="50" fill="#FFD93D" stroke="#111111" stroke-width="3" transform="rotate(-12 95 105)" />
  <circle cx="320" cy="110" r="22" fill="#7DE3A8" stroke="#111111" stroke-width="3" />
  
  <!-- Floating star shape -->
  <path d="M 320 280 L 327 295 L 342 298 L 331 309 L 334 324 L 320 316 L 306 324 L 309 309 L 298 298 L 313 295 Z" fill="#7CB7FF" stroke="#111111" stroke-width="3" />

  <!-- Character Body / Shoulders -->
  <path d="M 80 400 C 80 320 130 280 200 280 C 270 280 320 320 320 400 Z" fill="#111111" />
  <!-- Jacket / Hoodie Lapel -->
  <path d="M 140 400 L 175 300 L 200 340 L 225 300 L 260 400 Z" fill="#FFD93D" stroke="#111111" stroke-width="3.5" />
  <!-- Inner shirt -->
  <polygon points="185,340 215,340 200,370" fill="#FFFFFF" stroke="#111111" stroke-width="3" />

  <!-- Neck -->
  <rect x="175" y="220" width="50" height="65" fill="#FFA94D" stroke="#111111" stroke-width="3.5" rx="6" />

  <!-- Head / Face -->
  <rect x="140" y="110" width="120" height="135" rx="36" fill="#FFEFC2" stroke="#111111" stroke-width="4" />

  <!-- Hair (Modern haircut) -->
  <path d="M 130 140 C 130 80 160 55 200 55 C 240 55 270 80 270 140 C 255 125 240 120 220 120 C 190 120 170 135 130 140 Z" fill="#111111" />
  <!-- Sideburns -->
  <rect x="136" y="140" width="12" height="30" fill="#111111" />
  <rect x="252" y="140" width="12" height="30" fill="#111111" />

  <!-- Eyebrows -->
  <path d="M 155 140 Q 170 134 185 138" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 215 138 Q 230 134 245 140" stroke="#111111" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Stylish Glasses (Neo-Brutalist bold frames) -->
  <rect x="150" y="146" width="42" height="32" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  <rect x="208" y="146" width="42" height="32" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  <line x1="192" y1="160" x2="208" y2="160" stroke="#111111" stroke-width="4" />
  <line x1="140" y1="158" x2="150" y2="158" stroke="#111111" stroke-width="4" />
  <line x1="250" y1="158" x2="260" y2="158" stroke="#111111" stroke-width="4" />

  <!-- Eyes behind glasses -->
  <circle cx="171" cy="162" r="5" fill="#111111" />
  <circle cx="229" cy="162" r="5" fill="#111111" />
  <!-- Eye glint -->
  <circle cx="173" cy="160" r="1.5" fill="#FFFFFF" />
  <circle cx="231" cy="160" r="1.5" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M 197 175 L 202 188 L 195 190" stroke="#111111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Friendly Smile -->
  <path d="M 184 205 Q 200 218 216 205" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Cheek blush -->
  <ellipse cx="152" cy="192" rx="8" ry="4" fill="#FF8FB8" opacity="0.8" />
  <ellipse cx="248" cy="192" rx="8" ry="4" fill="#FF8FB8" opacity="0.8" />
</svg>

