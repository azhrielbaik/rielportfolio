<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <rect width="640" height="400" fill="#FFEFC2" />
  <!-- Frozen Food Landing Page Next.js + WA -->
  <rect x="50" y="50" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  <rect x="50" y="50" width="540" height="50" rx="16" fill="#7DE3A8" stroke="#111111" stroke-width="4" />
  <text x="80" y="81" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">NEXT.JS // FROZEN FOOD &amp; WHATSAPP ORDER</text>

  <!-- Snowflake graphic -->
  <g transform="translate(140, 210)">
    <circle cx="0" cy="0" r="45" fill="#7CB7FF" stroke="#111111" stroke-width="3.5" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#111111" stroke-width="4" stroke-linecap="round" />
    <line x1="-20" y1="20" x2="20" y2="-20" stroke="#111111" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Product Box -->
  <rect x="230" y="140" width="160" height="150" rx="10" fill="#FFD93D" stroke="#111111" stroke-width="3" />
  <rect x="250" y="160" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
  <text x="270" y="200" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">PREMIUM</text>
  <rect x="250" y="245" width="80" height="25" rx="6" fill="#FF8FB8" stroke="#111111" stroke-width="2" />
  <text x="260" y="262" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#111111">Rp 45.000</text>

  <!-- WhatsApp Button Pill -->
  <rect x="420" y="180" width="150" height="50" rx="25" fill="#25D366" stroke="#111111" stroke-width="3.5" />
  <circle cx="445" cy="205" r="14" fill="#FFFFFF" />
  <text x="470" y="211" font-family="'Space Mono', monospace" font-size="13" font-weight="bold" fill="#FFFFFF">ORDER WA</text>
</svg>

