<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <rect width="640" height="400" fill="#FFEFC2" />
  <!-- E-commerce Laravel + Midtrans + Maps -->
  <rect x="50" y="50" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  
  <!-- Top bar -->
  <rect x="50" y="50" width="540" height="50" rx="16" fill="#7CB7FF" stroke="#111111" stroke-width="4" />
  <circle cx="80" cy="75" r="8" fill="#111111" />
  <circle cx="105" cy="75" r="8" fill="#111111" />
  <circle cx="130" cy="75" r="8" fill="#111111" />
  <text x="160" y="81" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">STORE // MIDTRANS &amp; GOOGLE MAPS</text>

  <!-- Credit Card / Payment Badge -->
  <rect x="90" y="140" width="220" height="135" rx="12" fill="#FFD93D" stroke="#111111" stroke-width="4" />
  <rect x="90" y="170" width="220" height="28" fill="#111111" />
  <rect x="110" y="225" width="60" height="20" rx="4" fill="#FF8FB8" stroke="#111111" stroke-width="2" />
  <circle cx="270" cy="235" r="14" fill="#FF8FB8" stroke="#111111" stroke-width="2" />
  <circle cx="285" cy="235" r="14" fill="#7DE3A8" stroke="#111111" stroke-width="2" />

  <!-- Map GPS pin & route -->
  <path d="M 360 250 Q 430 170 510 210" stroke="#111111" stroke-width="4" stroke-dasharray="8 8" fill="none" />
  
  <!-- Map Pin -->
  <circle cx="510" cy="180" r="26" fill="#FF8FB8" stroke="#111111" stroke-width="4" />
  <circle cx="510" cy="180" r="10" fill="#111111" />
  <polygon points="492,196 528,196 510,230" fill="#FF8FB8" stroke="#111111" stroke-width="3" />

  <!-- Shopping Bag Badge -->
  <rect x="360" y="130" width="100" height="70" rx="8" fill="#7DE3A8" stroke="#111111" stroke-width="3" />
  <path d="M 390 130 C 390 115 430 115 430 130" stroke="#111111" stroke-width="3.5" fill="none" />
  <text x="382" y="170" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#111111">CHECKOUT</text>
</svg>

