<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <rect width="640" height="400" fill="#FFF6DC" />
  <!-- DelimaCare Healthcare System -->
  <defs>
    <pattern id="delima-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#111111" fill-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#delima-dots)" />
  
  <!-- Hospital Cross Card -->
  <rect x="50" y="50" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  <rect x="50" y="50" width="540" height="50" rx="16" fill="#FF8FB8" stroke="#111111" stroke-width="4" />
  <circle cx="80" cy="75" r="8" fill="#111111" />
  <circle cx="105" cy="75" r="8" fill="#111111" />
  <circle cx="130" cy="75" r="8" fill="#111111" />
  <text x="160" y="81" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">DELIMACARE // SISTEM INFORMASI KLINIK</text>

  <!-- Big Red/Pink Medical Cross -->
  <rect x="280" y="140" width="80" height="150" fill="#FF8FB8" stroke="#111111" stroke-width="4" rx="8" />
  <rect x="245" y="175" width="150" height="80" fill="#FF8FB8" stroke="#111111" stroke-width="4" rx="8" />

  <!-- Heartbeat ECG line -->
  <path d="M 90 260 L 170 260 L 190 220 L 210 290 L 230 240 L 250 260 L 390 260 L 410 210 L 430 300 L 450 240 L 470 260 L 550 260" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Badge -->
  <rect x="420" y="125" width="140" height="36" rx="18" fill="#7DE3A8" stroke="#111111" stroke-width="3" />
  <text x="440" y="148" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#111111">LARAVEL + BLADE</text>
</svg>

