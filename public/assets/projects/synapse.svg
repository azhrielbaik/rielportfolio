<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <rect width="640" height="400" fill="#FFF6DC" />
  <!-- Synapse UI/UX Prototype -->
  <rect x="50" y="50" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  
  <!-- Header -->
  <rect x="50" y="50" width="540" height="50" rx="16" fill="#C4A8FF" stroke="#111111" stroke-width="4" />
  <text x="80" y="81" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">FIGMA // SYNAPSE DESIGN SYSTEM &amp; PROTOTYPE</text>

  <!-- Wireframe Cards -->
  <rect x="90" y="130" width="140" height="180" rx="10" fill="#FFD93D" stroke="#111111" stroke-width="3" />
  <rect x="105" y="150" width="110" height="16" rx="4" fill="#111111" />
  <rect x="105" y="180" width="80" height="10" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
  <rect x="105" y="200" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
  <rect x="105" y="255" width="50" height="24" rx="12" fill="#FF8FB8" stroke="#111111" stroke-width="2" />

  <!-- Connecting Node / Bezier line -->
  <path d="M 230 190 C 290 190 270 230 330 230" stroke="#111111" stroke-width="4" stroke-dasharray="6 6" fill="none" />

  <rect x="330" y="140" width="180" height="160" rx="10" fill="#7DE3A8" stroke="#111111" stroke-width="3" />
  <circle cx="365" cy="175" r="18" fill="#FFFFFF" stroke="#111111" stroke-width="3" />
  <rect x="395" y="165" width="95" height="14" rx="4" fill="#111111" />
  <rect x="350" y="210" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2" />

  <!-- Figma Cursor -->
  <polygon points="460,250 470,290 482,280 496,295 504,288 490,273 502,265" fill="#FF8FB8" stroke="#111111" stroke-width="3" />
  <rect x="495" y="235" width="70" height="22" rx="4" fill="#111111" />
  <text x="502" y="250" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">Azhriel</text>
</svg>

