  <rect x="50" y="50" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4" />
  <rect x="50" y="50" width="540" height="50" rx="16" fill="#FF8FB8" stroke="#111111" stroke-width="4" />
  <text x="80" y="81" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#111111">REACT NATIVE // APLIKASI KASIR POS MOBILE</text>

