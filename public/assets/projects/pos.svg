  <!-- Printed Receipt paper -->
  <path d="M 330 130 L 480 130 L 480 290 L 465 280 L 450 290 L 435 280 L 420 290 L 405 280 L 390 290 L 375 280 L 360 290 L 345 280 L 330 290 Z" fill="#FFEFC2" stroke="#111111" stroke-width="3.5" />
