  <text x="345" y="195" font-family="'Space Mono', monospace" font-size="10" fill="#111111">ITEM 1 ........... 25K</text>
  <text x="345" y="215" font-family="'Space Mono', monospace" font-size="10" fill="#111111">ITEM 2 ........... 15K</text>
